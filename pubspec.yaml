name: taskduo
description: Tarefas em dupla. Uma casa mais leve.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
          weight: 400
        - asset: assets/fonts/Nunito.ttf
          weight: 600
        - asset: assets/fonts/Nunito.ttf
          weight: 700
        - asset: assets/fonts/Nunito.ttf
          weight: 800
        - asset: assets/fonts/Nunito.ttf
          weight: 900
